name: Scientific checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify documented PowerShell activation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          python -c "import sys; assert sys.prefix != sys.base_prefix"
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the built wheel and development tools
        run: python -m pip install "dist/semiconductor_carrier_statistics-0.1.0-py3-none-any.whl[plots,dev]"
      - name: Check installed API and command outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import carrier_stats; from carrier_stats import solve_equilibrium; assert 'site-packages' in carrier_stats.__file__; assert solve_equilibrium(300, 1e15).neutrality_relative_residual < 2e-9"
          carrier-stats --temperature 300 --donors 1e15
          python -m pip check
      - name: Check formatting and lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run scientific tests and report
        run: |
          python -m pytest -q
          python examples/validate_model.py
          python -m carrier_stats --temperature 300 --donors 1e15
      - name: Execute figure generation
        if: matrix.python-version == '3.12'
        run: python examples/build_figures.py
